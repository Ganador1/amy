# A.M.Y Configuration
# ────────────────────

# The mission A.M.Y will autonomously pursue
mission:
  goal: "Investigar propiedades estadísticas y distribucionales de los gaps entre números primos"
  description: "Disenar experimentos computacionales para caracterizar la distribucion de gaps primos y evaluar hipotesis de normalidad"
  urgency: medium  # low, medium, high — affects heartbeat frequency

# LLM Backend — Ollama Cloud with GLM 5.2
llm:
  # Provider: ollama_cloud (uses https://ollama.com/api)
  provider: "ollama_cloud"
  base_url: "https://ollama.com/api"

  # Main reasoning model (for deep thinking, reflection, hypothesis generation)
  reasoner:
    model: "glm-5.2"
    temperature: 0.7
    max_tokens: 4096
    num_ctx: 8192  # Reduced context for faster response under rate limits

  # Fast model (for quick classifications, summaries, routine tasks)
  fast:
    model: "glm-5.2"
    temperature: 0.3
    max_tokens: 1024
    num_ctx: 8192

  # Dual API keys for parallel load balancing (set in .env)
  # OLLAMA_CLOUD_API_KEY_1=...
  # OLLAMA_CLOUD_API_KEY_2=...

# Hardware — Apple Silicon M4 with MPS Metal
hardware:
  device: "mps"           # Apple Metal Performance Shaders
  dtype: "float16"        # MPS supports fp16 natively
  platform: "darwin_arm64"
  # MPS-specific optimizations
  mps_fallback_to_cpu: true  # Fallback for unsupported MPS ops

# Heartbeat — the cognitive cycle
heartbeat:
  # Base interval in seconds between cognitive cycles
  base_interval_seconds: 30
  # When deeply focused, cycle faster
  focused_interval_seconds: 5
  # When idle/reflecting, cycle slower
  idle_interval_seconds: 120
  # Maximum cycles before forced reflection
  max_cycles_before_reflection: 20
  # When a mission is declared complete:
  #   continuous_mission: true  → A.M.Y generates the next, deeper mission
  #     from what it learned and keeps going (the "never sleeps" behaviour).
  #   continuous_mission: false → "Satisfaction Mode": stop and hibernate to
  #     bound API usage. Safe default for unattended single-mission runs.
  continuous_mission: false

# Memory
memory:
  # Keep unrelated missions in separate graph/log/vector directories. Existing
  # legacy files below remain untouched and are used only when this is false.
  namespace_by_mission: true
  mission_memory_root: "./data/missions"
  # ChromaDB for vector search
  vector_db_path: "./data/chromadb"
  # Knowledge graph persistence
  knowledge_graph_path: "./data/knowledge_graph.json"
  # Episodic memory log
  episodic_log_path: "./data/episodic_memory.jsonl"
  # Maximum episodic memories before consolidation
  max_episodic_before_consolidation: 1000
  # Confidence threshold for keeping beliefs
  belief_confidence_threshold: 0.3

# Skills
skills:
  library_path: "./data/skill_library"
  # Max skills to retrieve for context
  max_retrieval: 5

# Research
research:
  # Papers per search
  max_papers_per_search: 10
  # Sources
  sources:
    - arxiv
    - pubmed
    - semantic_scholar
  # Auto-download PDFs
  download_pdfs: false

# Atlas integration
atlas:
  # Full Atlas peer review is a separate subprocess.  A bounded deadline keeps
  # one slow provider/tool from freezing the cognitive loop.
  peer_review_timeout_seconds: 90
  # Keep the bridge aligned with the primary reasoning model.
  model: "glm-5.2"

# Curiosity / Intrinsic Motivation
curiosity:
  # Weight of epistemic value vs pragmatic value (0-1)
  # Higher = more exploratory, lower = more goal-focused  
  epistemic_weight: 0.4
  # Threshold of "surprise" to trigger deeper investigation
  surprise_threshold: 0.7
  # Decay rate for curiosity about already-explored topics
  novelty_decay: 0.95

# Communication
communication:
  # How to notify the user
  method: "file"  # file, webhook, email, terminal
  # Only report if breakthrough confidence > threshold
  breakthrough_threshold: 0.5
  # Report file path
  report_path: "./reports/"
  # Maximum reports per day (avoid spam)
  max_reports_per_day: 10

# Sandbox (for running experiments safely)
sandbox:
  enabled: true
  # Isolation tier for LLM-generated experiment code:
  #   use_docker: true  → strongest. Runs each experiment in an ephemeral
  #     container with --network=none and a memory cap. REQUIRES the Docker
  #     daemon running and the `amy-sandbox:latest` image built
  #     (see sandbox/Dockerfile). Recommended for unattended/24-7 operation.
  #   use_docker: false → hardened-subprocess fallback. The child now runs in
  #     a throwaway working directory (so a script cannot write into the repo)
  #     under a CPU rlimit. NOT a security boundary against a determined
  #     attacker, but bounds runaway CPU and accidental repo writes.
  #     NOTE: on macOS the per-process MEMORY cap is NOT enforceable in this
  #     tier (Darwin ignores RLIMIT_AS) — only Docker (--memory) caps memory
  #     on macOS. On Linux the subprocess tier caps memory too.
  use_docker: true
  # When true, refuse to run code if the requested Docker tier is unavailable
  # instead of silently downgrading to the weaker subprocess. Defaults to the
  # value of use_docker. Set explicitly to true for fail-closed operation.
  require_isolation: true
  # Generated experiments have neither network nor child-process access unless
  # a trusted local configuration explicitly opts in.
  allow_network: false
  allow_subprocess: false
  # Maximum execution time per experiment (seconds) — also the CPU rlimit.
  max_execution_time: 300
  # Maximum memory per experiment — enforced via rlimit (subprocess) or
  # --memory (docker).
  max_memory_mb: 2048
  # Allowed languages in sandbox
  allowed_languages:
    - python
    - r

# Atlas paper quality gate
atlas_quality_gate:
  # Drafts below these evidence thresholds are saved under papers/quarantine/
  # and are not treated as accepted science by AMY.
  min_support_score: 0.35
  min_tool_realism_score: 0.60
  max_failure_count: 5
  verify_citations: true

# Logging
logging:
  level: INFO
  # Stream of consciousness log (every thought)
  thought_log_path: "./logs/stream_of_consciousness.jsonl"
  # Action log (every action taken)
  action_log_path: "./logs/actions.jsonl"

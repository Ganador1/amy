name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - public-release-hardening
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Ruff correctness gate
        # Enforce syntax/undefined-name failures now.  Broader style cleanup can
        # proceed incrementally without making the embedded Atlas tree a blocker.
        run: |
          ruff check \
            amy.py core cognition memory senses communication evolution sandbox skills tests \
            --select E9,F63,F7,F82 \
            --output-format=github

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked minimal runtime + test deps
        run: |
          python -m pip install --upgrade "uv==0.9.17"
          # The ci dependency group excludes heavy ML dependencies while
          # uv.lock pins the complete transitive CI environment.
          uv sync --locked --only-group ci

      - name: Show environment
        run: |
          python --version
          uv run --no-sync python -c "import pytest, yaml, rich, structlog, numpy, scipy, sympy, networkx, httpx, reportlab; print('deps ok')"

      - name: Run complete fast hermetic suite
        # Select by capability instead of maintaining a manual file list. This
        # automatically picks up new tests and excludes files that spawn Atlas,
        # call external services, or intentionally run long missions.
        run: |
          uv run --no-sync python -m pytest \
            tests \
            -m "not (slow or network or atlas)" \
            -q --tb=short -p no:cacheprovider

      - name: Run focused Atlas evidence-boundary tests
        run: |
          PYTHONPATH=atlas uv run --no-sync python -m pytest \
            atlas/tests/unit/orchestration/test_tool_evidence_external_science.py \
            --confcutdir=atlas/tests/unit/orchestration \
            -q --tb=short -p no:cacheprovider

      - name: Verify every Atlas tool computes (no mocks, deterministic)
        run: uv run --no-sync python scripts/diagnostics/verify_atlas_tools.py

  hygiene:
    name: Public release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install minimal deps
        run: python -m pip install --upgrade pip pytest "pytest-timeout>=2.3"

      - name: Run public release hygiene tests
        run: python -m pytest tests/test_public_release_hygiene.py -q

      - name: Verify secret hygiene
        run: python scripts/diagnostics/verify_secret_hygiene.py --strict

  build-check:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distribution artifacts
        run: python -m build --sdist --wheel --outdir dist/

      - name: List artifacts
        run: ls -lah dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amy-dist-${{ github.sha }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
